<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glossy grass block">
  <defs>
    <linearGradient id="topGrad" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c9ff8c"/>
      <stop offset="0.5" stop-color="#7bdd3f"/>
      <stop offset="1" stop-color="#3f971c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#c98a50"/>
      <stop offset="0.6" stop-color="#8f5a2e"/>
      <stop offset="1" stop-color="#543015"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a26836"/>
      <stop offset="0.65" stop-color="#6b4020"/>
      <stop offset="1" stop-color="#3f230f"/>
    </linearGradient>
    <linearGradient id="grassLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f56a"/>
      <stop offset="1" stop-color="#3c8418"/>
    </linearGradient>
    <linearGradient id="grassRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79d943"/>
      <stop offset="1" stop-color="#2f6b12"/>
    </linearGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <ellipse cx="32" cy="59" rx="21" ry="3.4" fill="#021006" opacity="0.45" filter="url(#shadow)"/>

  <!-- left face -->
  <path d="M4 19 L32 33 L32 59 L4 45 Z" fill="url(#leftGrad)" stroke="#4f2d14" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- right face -->
  <path d="M60 19 L32 33 L32 59 L60 45 Z" fill="url(#rightGrad)" stroke="#341d0c" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- top -->
  <path d="M32 5 L60 19 L32 33 L4 19 Z" fill="url(#topGrad)" stroke="#2f6b12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- gloss -->
  <path d="M32 8 L54 19 L32 30 L10 19 Z" fill="url(#sheen)" opacity="0.55"/>
  <ellipse cx="26" cy="14" rx="9" ry="2.5" transform="rotate(-26 26 14)" fill="#ffffff" opacity="0.28"/>

  <!-- grass lips -->
  <path d="M4 19 L32 33 L32 37 C24 34 16 36 4 31 Z" fill="url(#grassLeft)"/>
  <path d="M60 19 L32 33 L32 37 C40 34 48 36 60 31 Z" fill="url(#grassRight)"/>

  <!-- highlights -->
  <path d="M4 19 L32 5 L60 19" fill="none" stroke="#e6ffc9" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <path d="M4 20 L4 45" fill="none" stroke="#f1c690" stroke-width="0.9" opacity="0.35"/>
  <path d="M32 33 L32 59" fill="none" stroke="#2b1508" stroke-width="0.9" opacity="0.35"/>
  <path d="M32 5 L60 19 L60 45 L32 59 L4 45 L4 19 Z" fill="none" stroke="#1b0f06" stroke-width="1" opacity="0.65" stroke-linejoin="round"/>

  <!-- tiny spark accent -->
  <path d="M32 8 L33.2 17 L40 18 L33.2 19 L32 28 L30.8 19 L24 18 L30.8 17 Z" fill="#eaffff" opacity="0.55"/>
</svg>
