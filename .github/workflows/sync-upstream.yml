name: Sync upstream and release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the release even if the version is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15
    env:
      FEED: https://d1jl7r3beoolrj.cloudfront.net/worldshub-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check upstream version
        id: check
        run: |
          set -euo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' "$FEED/latest.yml?ts=$(date +%s)" -o latest.yml
          upstream="$(awk '/^version:/{print $2; exit}' latest.yml | tr -d "'\"")"
          current="$(node -p "require('./package.json').upstreamVersion || require('./package.json').version")"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$current" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date at upstream $upstream"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updating upstream $current -> $upstream"
          fi

      - name: Install 7-Zip
        if: steps.check.outputs.changed == 'true'
        run: brew install sevenzip

      - name: Download and extract upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          file="$(awk '/^path:/{sub(/^path: /,""); print; exit}' latest.yml | tr -d "'\"")"
          expected="$(awk '/^sha512:/{print $2; exit}' latest.yml)"
          encoded="$(node -e 'console.log(encodeURI(process.argv[1]))' "$file")"

          curl -fL --retry 3 -o upstream-setup.exe "$FEED/$encoded"
          actual="$(openssl dgst -sha512 -binary upstream-setup.exe | openssl base64 -A)"
          [ "$actual" = "$expected" ] || { echo "SHA-512 mismatch"; exit 1; }

          mkdir -p .upstream/installer
          7zz x -y upstream-setup.exe -o.upstream/installer
          7zz x -y '.upstream/installer/$PLUGINSDIR/app-64.7z' -o.upstream/app
          npx --yes @electron/asar extract .upstream/app/resources/app.asar .upstream/appcode

      - name: Update client source
        id: update
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          upstream="${{ steps.check.outputs.upstream }}"
          current="$(node -p "require('./package.json').upstreamVersion || require('./package.json').version")"

          cp .upstream/appcode/client.js \
             .upstream/appcode/config.js \
             .upstream/appcode/host.js \
             .upstream/appcode/minecraft-datachannel-parser.js \
             .upstream/appcode/minecraft-server-manager.js \
             .upstream/appcode/preload.js .
          cp .upstream/appcode/main-process/utils/turn-servers.js main-process/utils/

          for patch in patches/client-registration-failed.patch patches/host-insecure-tls.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

          if [ "$upstream" != "$current" ]; then
            npm pkg set "upstreamVersion=$upstream"
            npm version patch --no-git-tag-version --force
          fi

          app_version="$(node -p "require('./package.json').version")"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "App version: $app_version (upstream $upstream)"

          sed -i '' -E \
            "s|Download [0-9][0-9A-Za-z.-]*|Download $app_version|g; s|Download-[0-9][0-9A-Za-z.]*|Download-$app_version|g" \
            README.md README.ru.md

          sed -i '' -E \
            "s|\"softwareVersion\": \"[0-9]+\.[0-9]+\.[0-9]+\"|\"softwareVersion\": \"$app_version\"|g" \
            docs/index.html docs/ru/index.html
          sed -i '' -E "s|<lastmod>[0-9-]+</lastmod>|<lastmod>$(date -u +%F)</lastmod>|g" docs/sitemap.xml

      - name: Set up Java 17
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Smoke test
        if: steps.check.outputs.changed == 'true'
        run: |
          node -e "require('./client'); require('./host'); console.log('modules load ok')"
          npm test

      - name: Build, sign and archive
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm run build
          codesign --force --deep --sign - dist/mac-arm64/WorldsHub.app
          rm -f WorldsHub-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent dist/mac-arm64/WorldsHub.app WorldsHub-macOS-arm64.zip

      - name: Commit updated source
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js config.js host.js minecraft-datachannel-parser.js \
            minecraft-server-manager.js preload.js \
            main-process/utils/turn-servers.js package.json package-lock.json \
            README.md README.ru.md docs/index.html docs/ru/index.html docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Sync upstream WorldsHub ${{ steps.check.outputs.upstream }} (app ${{ steps.update.outputs.app_version }})"
            git push
          fi

      - name: Publish release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.update.outputs.app_version }}"
          tag="v$version"
          cat > release-notes.md <<EOF
          Unofficial WorldsHub client for macOS (Apple Silicon, arm64). Host and join Minecraft worlds.

          **Install**
          1. Download \`WorldsHub-macOS-arm64.zip\`, unzip, drag \`WorldsHub.app\` into \`/Applications\`.
          2. First launch: right-click the app → **Open** (ad-hoc signed, not notarized).
          3. To join: log in, pick a world, then connect to \`localhost:25565\` in Minecraft Java Edition.
          4. To host: install/start a Minecraft server from the app, then press Host.

          [Website](https://vladyio.github.io/worldshub-macos/) · [README](https://github.com/vladyio/worldshub-macos#readme) · [Русский](https://github.com/vladyio/worldshub-macos/blob/main/README.ru.md)
          EOF
          sed -i '' 's/^ *//' release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi

          gh release create "$tag" WorldsHub-macOS-arm64.zip \
            --title "WorldsHub for macOS $version (Apple Silicon)" \
            --target "$(git rev-parse HEAD)" \
            --notes-file release-notes.md
